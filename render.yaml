# Render blueprint: one free web service. Free instances have no disk and sleep after 15 idle minutes, so
# shared worlds and profiles are mirrored to a free Upstash Redis (see README, "Free hosting").
# Secrets are set in the dashboard, never here.
services:
  - type: web
    name: royal-ramble
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /data
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: FALKORDB_URL        # e.g. falkor://HOST:PORT from FalkorDB Cloud
        sync: false
      - key: FALKORDB_USERNAME
        sync: false
      - key: FALKORDB_PASSWORD
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
