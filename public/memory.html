<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ledger · Royal Ramble</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
<style>
  :root { --parch:#ecdfbf; --parch-2:#e0cfa4; --ink:#2a1d10; --ink-2:#4f3b25; --ink-3:#7f6a4e; --red:#8a2a1a; --green:#3f6a2f; --blue:#3d5a6e; --gold:#b8901f; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:#6f8584; color:var(--ink); font-family:'Lora', Georgia, serif; font-size:15px; }
  /* the same burnt paper the game's panels use */
  .sheet { position:relative; max-width:1120px; margin:18px auto; padding:26px 30px 34px; background:var(--parch) url('/portrait/wrinkled-paper.png'); background-size:700px; box-shadow:0 6px 30px rgba(30,18,6,.55), inset 0 0 70px rgba(90,60,20,.45); }
  .sheet::before { content:''; position:absolute; inset:7px; border:2.2px solid var(--ink); border-radius:6px 12px 7px 10px / 10px 6px 12px 7px; filter:url(#rough); pointer-events:none; }
  .sheet::after { content:''; position:absolute; inset:12px; border:1px solid rgba(42,29,16,.5); border-radius:3px 8px 4px 9px / 9px 3px 8px 4px; filter:url(#rough2); pointer-events:none; }
  header { display:flex; align-items:baseline; gap:18px; flex-wrap:wrap; margin-bottom:6px; }
  h1 { font:600 26px 'Cinzel', serif; letter-spacing:.05em; margin:0; }
  .tally { font:18px 'Kalam', cursive; color:var(--ink-2); }
  .tally b { color:var(--red); font-weight:700; }
  #redo { margin-left:auto; font:16px 'Kalam', cursive; background:none; border:0; color:var(--ink-3); cursor:pointer; text-decoration:underline wavy; text-underline-offset:4px; }
  #err { font:17px 'Kalam', cursive; color:var(--red); margin:4px 0 0; }
  .cols { display:grid; grid-template-columns:1.25fr 1fr; gap:26px; margin-top:12px; } @media (max-width:820px){ .cols{ grid-template-columns:1fr; } }
  .map { position:relative; }
  canvas { width:100%; height:520px; display:block; cursor:default; }
  .key { font:15px 'Kalam', cursive; color:var(--ink-2); display:flex; gap:16px; flex-wrap:wrap; }
  .key i { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; border:1.5px solid var(--ink); }
  h2 { font:600 15px 'Cinzel', serif; letter-spacing:.08em; margin:2px 0 8px; color:var(--ink-2); }
  .note { font:18px/1.3 'Kalam', cursive; padding:6px 0 8px; border-bottom:1.5px dashed rgba(79,59,37,.45); }
  .note small { display:block; font-size:14px; color:var(--ink-3); }
  .cy { margin:4px 0 14px; }
  .cy .m { font:15px 'Kalam', cursive; color:var(--ink-3); }
  .cy code { display:block; font:12.5px/1.45 'Consolas', 'Courier New', monospace; color:var(--red); word-break:break-word; margin-top:1px; }
  #tip { position:fixed; pointer-events:none; max-width:300px; padding:5px 10px; font:16px/1.25 'Kalam', cursive; background:var(--parch-2); border:1.5px solid var(--ink); border-radius:4px 9px 5px 8px; box-shadow:2px 3px 0 rgba(42,29,16,.35); opacity:0; transition:opacity .1s; z-index:5; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="rough2" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3" xChannelSelector="R" yChannelSelector="G"/></filter>
</svg>
<div class="sheet">
  <header>
    <h1>The Ledger</h1>
    <span class="tally" id="tally"></span>
    <button id="redo">look again</button>
  </header>
  <p id="err"></p>
  <div class="cols">
    <div class="map">
      <canvas id="cv"></canvas>
      <div class="key" id="key"></div>
    </div>
    <div>
      <h2>Remembered</h2>
      <div id="mems"></div>
      <h2 style="margin-top:20px">Asked of the graph</h2>
      <div id="trace"></div>
    </div>
  </div>
</div>
<div id="tip"></div>
<script>
const INK = '#2a1d10';
const WASH = { Memory:'#d9a441', Character:'#6f9a54', House:'#a8402b', Ruler:'#5f86a0' };
let pid = ''; try { pid = localStorage.getItem('rb-pid') || ''; } catch {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c]));
const hash = n => { let h = 2166136261; for (const c of String(n)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; };
let raf, drawn = [];

async function load() {
  $('err').textContent = '';
  if (!pid) { $('err').textContent = 'No dynasty in this browser yet. Play a turn, then look again.'; return; }
  try {
    const [g, t] = await Promise.all([
      fetch('/api/memory/graph?sample=1&pid=' + encodeURIComponent(pid)).then(r => r.json()),
      fetch('/api/memory/trace?n=10').then(r => r.json()),
    ]);
    if (g.error) throw new Error(g.error);
    const n = l => (g.nodes.find(x => x.label === l) || {}).n || 0;
    const e = (g.edges || []).reduce((a, x) => a + x.n, 0);
    $('tally').innerHTML = `<b>${n('Memory')}</b> memories · <b>${n('Character')}</b> people · <b>${n('House')}</b> houses · <b>${e}</b> threads`;
    drawGraph(g.sampleNodes || [], g.sampleEdges || []);
    $('mems').innerHTML = (g.sampleNodes || []).filter(x => x.label === 'Memory').slice(-6).reverse().map(x => `<div class="note">${esc(x.text)}<small>${esc(x.name)}</small></div>`).join('') || '<div class="note">Nothing yet.</div>';
    $('trace').innerHTML = (t.trace || []).slice().reverse().map(q => `<div class="cy"><div class="m">${q.kind === 'write' ? 'wrote' : 'read'} · ${esc(q.label)} · ${q.ms} ms · ${q.rows} rows</div><code>${esc(q.cypher.slice(0, 300))}</code></div>`).join('') || '<div class="note">Nothing yet.</div>';
  } catch (er) { $('err').textContent = 'The graph would not answer: ' + er.message; }
}

// A hand-inked map: wobbly threads, little drawn blobs, names written beside the people and houses.
function wobble(ctx, ax, ay, bx, by, seed, amp) {
  const mx = (ax + bx) / 2, my = (ay + by) / 2, dx = by - ay, dy = ax - bx, d = Math.hypot(dx, dy) || 1, o = (hash(seed) - .5) * amp;
  ctx.moveTo(ax, ay); ctx.quadraticCurveTo(mx + dx / d * o, my + dy / d * o, bx, by);
}
function blob(ctx, x, y, r, seed) {
  ctx.beginPath();
  for (let i = 0; i <= 10; i++) { const a = i / 10 * Math.PI * 2, k = r * (0.86 + hash(seed + ':' + (i % 10)) * 0.28); i ? ctx.lineTo(x + Math.cos(a) * k, y + Math.sin(a) * k) : ctx.moveTo(x + Math.cos(a) * k, y + Math.sin(a) * k); }
  ctx.closePath();
}
function drawGraph(nodes, edges) {
  const cv = $('cv'), ctx = cv.getContext('2d'), dpr = devicePixelRatio || 1;
  const W = cv.width = cv.clientWidth * dpr, H = cv.height = cv.clientHeight * dpr;
  const used = {}; nodes.forEach(n => used[n.label] = 1);
  $('key').innerHTML = Object.keys(used).map(l => `<span><i style="background:${WASH[l] || '#999'}"></i>${l === 'Memory' ? 'things said' : l === 'Character' ? 'people' : l === 'House' ? 'houses' : 'rulers'}</span>`).join('');
  const byId = new Map(nodes.map(n => [n.id, { ...n, x: W / 2 + (hash(n.id + 'x') - .5) * W * .6, y: H / 2 + (hash(n.id + 'y') - .5) * H * .6, vx: 0, vy: 0 }]));
  const links = edges.map(e => ({ a: byId.get(e.source), b: byId.get(e.target), type: e.type })).filter(l => l.a && l.b);
  const ns = [...byId.values()]; let step = 0; cancelAnimationFrame(raf);
  const R = n => (n.label === 'Memory' ? 7 : n.label === 'House' ? 14 : 11) * dpr;
  (function tick() {
    for (const a of ns) for (const b of ns) if (a !== b) { const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy + 80, d = Math.sqrt(d2), f = 3600 * dpr * dpr / d2; a.vx += dx / d * f; a.vy += dy / d * f; }
    for (const l of links) { const dx = l.b.x - l.a.x, dy = l.b.y - l.a.y, d = Math.hypot(dx, dy) || 1, f = (d - 80 * dpr) * 0.02; l.a.vx += dx / d * f; l.a.vy += dy / d * f; l.b.vx -= dx / d * f; l.b.vy -= dy / d * f; }
    for (const n of ns) { n.vx += (W / 2 - n.x) * 0.004; n.vy += (H / 2 - n.y) * 0.004; n.x += n.vx *= 0.8; n.y += n.vy *= 0.8; n.x = Math.max(30 * dpr, Math.min(W - 30 * dpr, n.x)); n.y = Math.max(24 * dpr, Math.min(H - 24 * dpr, n.y)); }
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = INK; ctx.lineCap = 'round';
    for (const l of links) { ctx.lineWidth = (l.type === 'ENTANGLED' ? 2.4 : 1.3) * dpr; ctx.globalAlpha = l.type === 'ENTANGLED' ? .85 : .55; ctx.setLineDash(l.type === 'ABOUT_HOUSE' ? [5 * dpr, 5 * dpr] : []); ctx.beginPath(); wobble(ctx, l.a.x, l.a.y, l.b.x, l.b.y, l.a.id + '>' + l.b.id, 18 * dpr); ctx.stroke(); }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    for (const n of ns) {
      blob(ctx, n.x, n.y, R(n), n.id); ctx.fillStyle = WASH[n.label] || '#999'; ctx.fill(); ctx.lineWidth = 1.8 * dpr; ctx.strokeStyle = INK; ctx.stroke();
      if (n.label !== 'Memory') { ctx.fillStyle = INK; ctx.font = `${(n.label === 'House' ? 19 : 16) * dpr}px Kalam, cursive`; ctx.fillText(n.name || '', n.x + (R(n) + 4 * dpr), n.y + 5 * dpr); }
    }
    drawn = ns.map(n => ({ n, r: R(n) }));
    if (++step < 260) raf = requestAnimationFrame(tick);
  })();
}
// Hover a dot to read what it is.
$('cv').addEventListener('mousemove', ev => {
  const rc = $('cv').getBoundingClientRect(), k = ($('cv').width / rc.width), x = (ev.clientX - rc.left) * k, y = (ev.clientY - rc.top) * k;
  const hit = drawn.find(o => Math.hypot(o.n.x - x, o.n.y - y) < o.r + 4);
  const tip = $('tip');
  if (!hit) { tip.style.opacity = 0; return; }
  tip.textContent = hit.n.label === 'Memory' ? hit.n.text : hit.n.name;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - 320) + 'px'; tip.style.top = ev.clientY + 14 + 'px'; tip.style.opacity = 1;
});
$('cv').addEventListener('mouseleave', () => $('tip').style.opacity = 0);
$('redo').onclick = load; load();
</script>
</body>
</html>
